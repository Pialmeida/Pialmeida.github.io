name: Test & deploy

# Pull requests: run every check, so problems show up before anything reaches main.
# Pushes to main: run the same checks, and publish to GitHub Pages only if they pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, physics & rendering tests
    # Pinned: Playwright 1.55 ships browsers for Ubuntu 24.04, not 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    # 25: the apt --with-deps Chromium install alone took 7.5 min on 2026-11-24 runners (two runs cancelled at 15).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint HTML & JS
        run: npm run lint

      - name: Solver tests (stability, vortex shedding, Nusselt number, layout)
        run: npm run test:unit

      - name: Rendering tests (desktop, laptop, phone)
        run: npm run test:e2e

      - name: Upload screenshots & report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files (no tests or tooling)
        run: |
          mkdir _site
          cp -r index.html 404.html .nojekyll css js assets pt vgc _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
